<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PoolTracker — aktualne obłożenie basenów w Białymstoku" />
    <title>basen.bialystok.pl | Stan zajętości obiektów BOSiR Białystok</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
    <link rel="preload" href="/src/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function() {
        var saved;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var theme = saved === 'dark' || saved === 'light' ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
