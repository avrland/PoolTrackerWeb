# Standalone production configuration: do not merge with the build configuration.
services:
  db:
    image: postgres:16-alpine
    container_name: pooltracker-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tablechart/initdb:/docker-entrypoint-initdb.d:ro
      - ./poolStats.csv:/var/lib/postgresql/poolStats.csv:ro
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    container_name: pooltracker-web
    env_file: [.env]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - logs_data:/logs
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    container_name: pooltracker-frontend
    ports: ["8008:80"]
    restart: unless-stopped
  scrapper:
    image: ${SCRAPPER_IMAGE:?Set SCRAPPER_IMAGE}
    container_name: pooltracker-scrapper
    env_file: [.env]
    environment:
      TZ: Europe/Warsaw
    restart: unless-stopped
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: pooltracker-backup
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: ${SCHEDULE:-@weekly}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
    volumes:
      - ./backups:/backups
    restart: unless-stopped
volumes:
  postgres_data:
  logs_data:
