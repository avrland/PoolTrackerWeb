server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA routing — all paths fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy: Django API (new endpoint)
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy: historical chart data
    location /update_chart/ {
        proxy_pass http://web:8000/update_chart/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy: date-specific data (session auth — pass cookies)
    location /get_date_data/ {
        proxy_pass http://web:8000/get_date_data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # Retired entry points: never proxy or serve the SPA/static assets here.
    location = /chatbot {
        types { }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 410 '{"error":"Ta funkcja została wycofana."}';
    }

    location ^~ /chatbot/ {
        types { }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 410 '{"error":"Ta funkcja została wycofana."}';
    }

    # Cache static assets aggressively (Vite adds content hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
